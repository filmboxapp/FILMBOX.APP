<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FILMBOX</title>

  <meta name="description" content="Vive el cine sin límites en FILMBOX. Mira películas y series gratis en línea.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(17,17,17,0.9);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }

    header .logo {
      font-size: 20px;
      font-weight: bold;
      color: #e81c1c;
      white-space: nowrap;
    }

    header input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      background: #222;
      color: #fff;
    }

    /* ✅ CONTADOR */
    .total-count {
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .movie-card {
      position: relative;
      background-size: cover;
      background-position: center;
      aspect-ratio: 2/3;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .movie-card:hover {
      transform: scale(1.05);
    }

    .quality-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #e81c1c;
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .marquee {
      width: 100%;
      overflow: hidden;
      background: #e50914;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      padding: 8px 0;
      white-space: nowrap;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 12s linear infinite;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">FILMBOX</div>
  <input type="text" id="search" placeholder="Buscar...">
  <!-- ✅ CONTADOR -->
  <span id="totalCount" class="total-count">0 títulos</span>
</header>

<div class="marquee">
  <span>MEJORANDO NUESTROS SERVICIOS</span>
</div>

<section class="movies" id="movieList"></section>

<script>
  const movieList = document.getElementById('movieList');
  const searchInput = document.getElementById('search');
  const totalCount = document.getElementById('totalCount');

  let moviesData = [];

  // Cargar JSON
  fetch('Peliculas.json')
    .then(res => res.json())
    .then(data => {
      moviesData = data;
      renderMovies(moviesData);

      // ✅ MOSTRAR TOTAL REAL
      totalCount.textContent = data.length + " títulos";
    });

  function renderMovies(movies) {
    movieList.innerHTML = '';
    movies.forEach(movie => {
      const a = document.createElement('a');
      a.className = 'movie-card';
      a.href = movie.link;
      a.style.backgroundImage = `url('${movie.poster}')`;

      const q = document.createElement('span');
      q.className = 'quality-tag';
      q.textContent = movie.quality || 'HD';

      a.appendChild(q);
      movieList.appendChild(a);
    });
  }

  // Buscador (no cambia el contador)
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase();
    const filtered = moviesData.filter(m =>
      m.title.toLowerCase().includes(q)
    );
    renderMovies(filtered);
  });
</script>

</body>
</html>
